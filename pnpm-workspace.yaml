packages:
  - .
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@solidjs/vite-plugin"
overrides:
  # esbuild-plugin-solid still depends on babel-preset-solid@^1.x; force the
  # Solid 2.0 preset so the "dom" build compiles against @solidjs/web.
  babel-preset-solid: 2.0.0-rc.2
